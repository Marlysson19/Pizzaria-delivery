<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minha Pizzaria</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<header>
    <h1>🍕 Minha Pizzaria</h1>
</header>

<main>

    <h2>Nossas Pizzas</h2>

    <div class="pizza-area"></div>

<!-- CARRINHO DE COMPRAS -->
<section class="cart">
    <h2>🛒 Meu Carrinho</h2>

    <div class="cart-items"></div>

<!-- DADOS DO CLIENTE -->
<div class="customer-form">

    <h2>📍 Dados para entrega</h2>

    <label for="customer-name">Nome completo</label>
    <input
        type="text"
        id="customer-name"
        placeholder="Digite seu nome"
        required
    >

    <label for="customer-phone">Telefone</label>
    <input
        type="tel"
        id="customer-phone"
        placeholder="(86) 99999-9999"
        required
    >

    <label for="customer-address">Endereço completo</label>
    <input
        type="text"
        id="customer-address"
        placeholder="Rua, número e bairro"
        required
    >

    <label for="customer-reference">Ponto de referência</label>
    <input
        type="text"
        id="customer-reference"
        placeholder="Ex.: perto da praça"
    >

    <label for="payment-method">Forma de pagamento</label>
    <select id="payment-method" required>
        <option value="">Selecione o pagamento</option>
        <option value="Pix">Pix</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Cartão">Cartão</option>
    </select>

    <div id="change-area" style="display: none;">
        <label for="customer-change">Troco para quanto?</label>
        <input
            type="number"
            id="customer-change"
            min="0"
            step="0.01"
            placeholder="Ex.: 100,00"
        >
    </div>

</div>

<div class="cart-summary">

    <p>
        Subtotal:
        <span class="cart-subtotal">R$ 0,00</span>
    </p>

    <p>
        Desconto (10%):
        <span class="cart-discount">R$ 0,00</span>
    </p>

    <p>
        Taxa de entrega:
        <span class="cart-delivery">R$ 0,00</span>
    </p>

    <h3>
        Total:
        <span class="cart-total">R$ 0,00</span>
    </h3>

</div>

    <button class="cart-clear">
        Limpar carrinho
    </button>

    <button class="cart-finish">
        Finalizar pedido pelo WhatsApp
    </button>
</section>


</main>


<!-- JANELA DE DETALHES -->

<div class="pizzaWindowArea">

    <div class="pizzaWindowBody">

        <button class="pizzaWindowClose" type="button">
            ✕
        </button>

        <div class="pizzaBig">
            <img src="" alt="Pizza">
        </div>

        <div class="pizzaInfo">

            <h1>Nome da pizza</h1>

            <p class="pizzaInfo--desc">
                Descrição da pizza
            </p>

            <!-- TAMANHOS -->
            <div class="pizzaInfo--sector">
                TAMANHOS
            </div>

            <div class="pizzaInfo--sizes">
                <!-- Os tamanhos serão criados pelo JavaScript -->
            </div>

            <!-- QUANTIDADE -->
            <div class="pizzaInfo--sector">
                QUANTIDADE
            </div>

            <div class="pizzaInfo--quantityArea">

                <button
                    class="pizzaInfo--quantityButton"
                    type="button">
                    -
                </button>

                <div class="pizzaInfo--quantity">
                    1
                </div>

                <button
                    class="pizzaInfo--quantityButton"
                    type="button">
                    +
                </button>

            </div>

            <!-- PREÇO -->
            <div class="pizzaInfo--price">
                R$ 0,00
            </div>

            <!-- BOTÃO -->
            <button
                class="pizzaInfo--addButton"
                type="button">
                Adicionar ao carrinho
            </button>

        </div>

    </div>

</div>


<script src="pizzas.js"></script>
<script src="script.js"></script>


</body>

</html>
