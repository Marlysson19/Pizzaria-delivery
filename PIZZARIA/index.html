<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minha Pizzaria</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<header>
    <h1>🍕 Minha Pizzaria</h1>
</header>

<main>

    <h2>Nossas Pizzas</h2>

    <div class="pizza-area"></div>

</main>


<!-- JANELA DE DETALHES -->

<div class="pizzaWindowArea">

    <div class="pizzaWindowBody">

        <button class="pizzaWindowClose">
            ✕
        </button>

        <div class="pizzaBig">

            <img src="" alt="Pizza">

        </div>

        <div class="pizzaInfo">

            <h1>Nome da pizza</h1>

            <p class="pizzaInfo--desc">
                Descrição da pizza
            </p>

            <!-- TAMANHOS -->

            <div class="pizzaInfo--sizes">
                <div class="pizzaInfo--sector">
                    TAMANHO
                </div>

                <div class="pizzaInfo--sizes">
                    <!-- Os tamanhos serão criados peli JavaScript -->
                </div>

            </div>

            <!-- QUANTIDADE -->

            <div class="pizzaInfo--sector">
                QUANTIDADE
            </div>

            <div class="PizzaInfo--quantityArea">
                <button class="pizzaInfo--quantityButton">
                    -
                </button>

                <div class="pizzaInfo--quantity">
                    1
                </div>

                <button class="pizzaInfo--quantityButton">
                    +
                </button>

            </div>

            <!--PREÇO-->

            <div class="pizzaInfo--price">
                R$ 0,00
            </div>

            <!--BOTÃO-->

            <button class="pizzaInfo--addButton">
                Adicionar ao carrinho
            </button>

        </div>

    </div>

</div>


<script src="pizzas.js"></script>
<script src="script.js"></script>


</body>

</html>
